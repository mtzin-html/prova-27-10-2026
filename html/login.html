<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Entrar </title>
    <link href="../css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">
    <div class="container min-vh-100 d-flex justify-cintent-center align-itens-center">

                    <div class="card-body p-4 p-md-5">

                            <p class="text-secondary fs-5"> Preencha os Campos Abaixo </p>
                        </div>
                        <form>
                                            
                            <div class="mb-4">
                                <label class="form-label fw-semibold fs-5"> Seu email
                                </label>
                                <input type="email" class="form-control form-control-lg py-3" placeholder=" example@gmail.com"> 
                            </div>
                                             
                            <div class="mb-4">
                                <label class="form-label fw-semibold fs-5"> digite sua senha 
                                </label>
                                <input type="password" class="form-control form-control-lg py-3" placeholder=" ******** ">
                            </div>  
                                             
                            <button type="submit" class=" btn btn-primary btn-lg w-100 py-3 fs-5 mb-3 "> Entrar  </button>   
                            <div class="text-center">
                                <span class="text-secondary"> Não tem uma conta? </span>
                                <a href="index.html" class="text-decoration-none fw-semibold"> CRIAR</a>
                            </div>                                                          
                         </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script src="../js/bootstrap.bundle.min.js"></script>
